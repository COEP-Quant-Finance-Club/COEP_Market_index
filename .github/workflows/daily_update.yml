name: COEP Market Index - Daily EOD Automation

on:
  schedule:
    # Runs Monday to Friday at 10:30 AM UTC (4:00 PM IST - 30min after market close)
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  eod-update-and-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # Hard cap: kill job if it runs > 90 minutes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-yfinance

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0" "numpy>=1.24" "requests>=2.28" "yfinance>=0.2.40"

      - name: Run Master Market Index Engine
        run: |
          python coep_market_index_engine.py
        continue-on-error: false  # Fail the step if engine errors, but still commit below

      - name: Commit and Push Updated Data
        if: always()  # Always run commit/push even if engine had partial errors
        run: |
          git config --global user.name "COEP Quant Club Automation"
          git config --global user.email "quantclub@coep.ac.in"
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 300
          # Stage all generated data files and compiled dashboard
          git add Data.csv OHLCV/ json/ README.md "Portfolio Management Main/"
          git status
          git diff-index --quiet HEAD || {
            git commit -m "Auto EOD Update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull origin main --no-rebase -X ours --no-edit || true
            git push origin main
          }

