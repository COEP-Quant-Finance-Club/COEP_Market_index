name: COEP Market Index - Daily EOD Automation

on:
  schedule:
    # Runs Monday to Friday at 10:30 AM UTC (4:00 PM IST - Market Close)
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  eod-update-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests yfinance

      - name: Run Master Market Index Engine
        run: |
          python coep_market_index_engine.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "COEP Quant Club Automation"
          git config --global user.email "quantclub@coep.ac.in"
          git add OHLCV/ json/ README.md
          git status
          git diff-index --quiet HEAD || {
            git commit -m "Auto EOD Update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Merge remote changes, auto-resolving conflicts in favor of runner's fresh EOD data
            git pull origin main --no-rebase -X ours --no-edit || true
            git push origin main
          }
